[project]
name = "xeza-day"
version = "0.2.0"
description = "OSINT pivot engine: one identifier in, the public trail out"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "dnspython>=2.6",
    "phonenumbers>=8.13",
    "Pillow>=10.3",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
]

[project.scripts]
xeza = "xeza.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xeza"]
include-package-data = true

[tool.setuptools.package-data]
xeza = ["data/*.yaml"]